<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/c4d33f5660.js" crossorigin="anonymous"></script>
    <title>resultado de filtro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
</head>
<body>
    <header>
        <h2 class="logo">TRAYECTORIA</h2>
        <nav class="navegacion">
            <a href="#">Inicio</a>
            <a href="#">Feedbacks</a>
            <a href="#">Calificaciones Recibidas</a>
            <a href="https://zajuna.sena.edu.co/index.php?error=Informaci%C3%B3n%20de%20usuario%20inv%C3%A1lida">ir a zajuna</a>
            
            <button class="btn" onclick="mostrarLogin()">Editar perfil</button>
            
            
            
        </nav>
    </header>

    <div class="fondo" id="loginFondo">
        <span class="icono-cerrar" onclick="cerrarLogin()"><i class="fa-regular fa-circle-xmark"></i></span>
        <div class="contenedor-form login">
            <h2>Resultado de busqueda</h2>
            <!-- Mostrar los resultados de la búsqueda -->
            {% if resultados %}
    <ul>
        {% for usuario in resultados %}
            <li>
                <a href="{{url_for ('detalle_resultado_busqueda', user_id=usuario.id_usuario)}}">
                <strong>Labor:</strong> {{ usuario.labor }}<br>
                <strong>Ciudad:</strong> {{ usuario.ciudad }}
                </a>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No se encontraron resultados.</p>
{% endif %}
        </div>
    </div>
            
    </div>
    
    <script>
        function mostrarLogin() {
            document.getElementById('loginFondo').classList.add('active');
        }

        function cerrarLogin() {
            document.getElementById('loginFondo').classList.remove('active');
        }
    </script>
</body>
</html>
