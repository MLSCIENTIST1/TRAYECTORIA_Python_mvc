<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Nuevo Servicio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <h2 class="logo">TRAYECTORIA</h2>
        <nav class="navegacion">
            <a href="{{ url_for('main.index') }}">Inicio</a>
            <a href="{{ url_for('recive.show_notifications') }}">Notificaciones</a>
            <a href="{{ url_for('dashboard.dashboard') }}">Mi dashboard</a>
            <a href="{{ url_for('main.logout') }}">Cerrar sesión</a>
        </nav>
    </header>

    <div class="contenedor">
        <h1>Ofertar Nuevo Servicio</h1>
        <form action="{{ url_for('dashboard.new_service_page') }}" method="POST">
            <label for="nombre_servicio">Nombre del Servicio:</label>
            <input type="text" id="nombre_servicio" name="nombre_servicio" required>
            
            <label for="descripcion">Descripción:</label>
            <textarea id="descripcion" name="descripcion"></textarea>
            
            <label for="categoria">Categoría:</label>
            <input type="text" id="categoria" name="categoria">
            
            <label for="precio">Precio:</label>
            <input type="number" id="precio" name="precio" step="0.01" min="0">

            <button type="submit" class="btn">Agregar Servicio</button>
        </form>
        <a href="{{ url_for('dashboard.dashboard') }}">Cancelar</a>
    </div>
</body>
</html>
